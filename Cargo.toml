[package]
name = "runbook-tui"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rbt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
cwl_core = "0.10.0"
cwl_engine = "0.8.5"
cwl_engine_storage = "0.10.0"
dirs = "6.0.0"
ratatui = "0.30.2"
reqwest = "0.12.15"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shlex = "2.0.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.3"
unicode-width = "0.2.2"

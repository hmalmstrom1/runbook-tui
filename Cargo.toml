[package]
name = "runbook-tui"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rbt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
reqwest = "0.12.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
unicode-width = "0.2.2"
